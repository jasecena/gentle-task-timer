# Smoke test — does the built app actually launch and run?
#
# This is the only test that exercises the real binary on a real iOS runtime.
# Jest can prove the timer logic is right; it cannot tell you the app crashes on
# launch because of a native module, a missing asset or a bad Info.plist. That
# is what this catches, and it runs before the TestFlight upload.
#
# Deliberately shallow. Deep UI assertions belong in the Jest component suite,
# which is faster, runs on Linux and does not flake. This asserts only that the
# app boots, the clock genuinely ticks, and the controls respond.
#
# NOTE: the literals below are tied to INITIAL_CONFIG in
# src/features/timer/TimerScreen.tsx (name, 2 minute work phase, 3 repeats).
# Every control is labelled with its timer's name, because with several timers
# on screen "Pause" alone would be ambiguous. Change either and this flow must
# change with it.
#
# ${APP_ID} is substituted by the CI job from vars.IOS_BUNDLE_IDENTIFIER.

appId: ${APP_ID}
---
- launchApp:
    clearState: true

# --- Launched, and rendering the idle state ------------------------------
#
# The countdown is asserted by its FULL accessibility label, not by the bare
# "02:00" on screen. A Text with an accessibilityLabel exposes only that label
# to the accessibility tree, and matching a fragment of it is not something to
# rely on — v0.3 added the timer's name to the front of that label and the
# fragment match that had worked until then stopped matching, failing the
# release on a flow bug rather than a real one.
- assertVisible: 'READY'
- assertVisible: 'Gentle Task Timer: 02:00 remaining'
- assertVisible: 'Cycle 1 of 3'

# --- Starting moves it into the work phase -------------------------------
- tapOn: 'Start Gentle Task Timer'

# The first Start asks for notification permission, and the system dialog sits
# over the app swallowing the next tap. Optional because it appears exactly
# once per install: a re-run against a simulator that has already answered it
# must not fail here.
- tapOn:
    text: 'Allow'
    optional: true

- assertVisible: 'WORK'
- assertVisible: 'Pause Gentle Task Timer'

# The clock is genuinely running, not just rendered once. Waiting for the
# starting value to *disappear* is deterministic — no fixed sleep, so no timing
# flake. Full label again, and it matters more here: a fragment that never
# matches anything makes this assertion pass instantly and prove nothing.
- extendedWaitUntil:
    notVisible: 'Gentle Task Timer: 02:00 remaining'
    timeout: 10000

# --- Pausing holds position ----------------------------------------------
- tapOn: 'Pause Gentle Task Timer'
- assertVisible: 'Resume Gentle Task Timer'

# --- Reset returns to the initial state ----------------------------------
- tapOn: 'Reset Gentle Task Timer'
- assertVisible: 'READY'
- assertVisible: 'Gentle Task Timer: 02:00 remaining'

# --- The other tabs render -----------------------------------------------
# Worth the extra seconds: these screens are what pull in the icon font, the
# storage module and the text input, and a missing native module shows up as a
# blank screen here rather than as a crash on launch.
- tapOn: 'Schedule tab'
# The full string, like everything else here. "alerts a week" is a fragment of
# the label "85 of 48 alerts a week", and fragment matching is what failed the
# v0.3.0 and v0.3.1 releases. 85 is the default schedule: 17 a day, five days.
- assertVisible: '85 of 48 alerts a week'
- tapOn: 'Once tab'
- assertVisible: '0 of 8 notes waiting'
- tapOn: 'Timers tab'
- assertVisible: 'READY'
- assertVisible: '1 of 8 · 0 running'

# --- A second timer runs alongside the first -----------------------------
# The feature that most needs a real device to trust: two runs, two sets of
# pending notifications, no interference.
#
# Order matters, and not for the reason it looks. Every control is labelled
# with its timer's name, so "Start Gentle Task Timer" is a strict *prefix* of
# "Start Gentle Task Timer 2" — tapping it with both timers on screen is
# ambiguous. Starting the first while it is still the only one, then adding the
# second, means every tap targets a label nothing else shares.
- tapOn: 'Start Gentle Task Timer'
- tapOn: 'Add timer'
- tapOn: 'Start Gentle Task Timer 2'
- assertVisible: '2 of 8 · 2 running'

# Both still counting down, independently, from different start instants.
- assertVisible: 'Pause Gentle Task Timer 2'
- extendedWaitUntil:
    notVisible: 'Gentle Task Timer 2: 02:00 remaining'
    timeout: 10000
